spring:
  application:
    name: notification-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      retry:
        initial-interval: 3000
        max-interval: 10000
        multiplier: 1.3
        max-attempts: 10
    discovery:
      enabled: true

# Eureka Configuration for Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

---

spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888
    discovery:
      enabled: true

eureka:
  instance:
    hostname: notification-service
    ip-address: notification-service
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

---

spring:
  config:
    activate:
      on-profile: prod
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://config-server:8888}
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
